<article class="otc-root"
  data-use-project-profile="{{useProjectProfile}}"
  data-heading-typeface="{{headingTypeface}}"
  data-body-typeface="{{bodyTypeface}}"
  data-align="{{textAlign}}"
  data-line-fit="{{lineFit}}"
  data-block-align="{{blockAlign}}"
  data-columns="{{bodyColumns}}"
  data-drop-cap="{{dropCap}}"
  data-title-effect="{{titleEffect}}"
  data-motion="{{motionPreset}}"
  data-accent-style="{{accentStyle}}"
  data-surface-effect="{{surfaceEffect}}"
  data-background-enabled="{{backgroundEnabled}}"
  style="--otc-max:{{maxWidth}}px;--otc-px:{{paddingX}}px;--otc-py:{{paddingY}}px;--otc-gap:{{elementGap}}px;--otc-title-size:{{titleSize}}px;--otc-title-weight:{{titleWeight}};--otc-title-line:{{titleLineHeight}};--otc-title-tracking:{{titleTracking}}em;--otc-subtitle-size:{{subtitleSize}}px;--otc-subtitle-weight:{{subtitleWeight}};--otc-subtitle-line:{{subtitleLineHeight}};--otc-subtitle-tracking:{{subtitleTracking}}em;--otc-lead-size:{{leadSize}}px;--otc-lead-weight:{{leadWeight}};--otc-lead-line:{{leadLineHeight}};--otc-lead-tracking:{{leadTracking}}em;--otc-body-size:{{bodySize}}px;--otc-body-weight:{{bodyWeight}};--otc-body-line:{{bodyLineHeight}};--otc-body-tracking:{{bodyTracking}}em;--otc-columns:{{bodyColumns}};--otc-column-gap:{{columnGap}}px;--otc-radius:{{borderRadius}}px;--otc-local-bg:{{backgroundColor}};--otc-local-title:{{titleColor}};--otc-local-subtitle:{{subtitleColor}};--otc-local-lead:{{leadColor}};--otc-local-body:{{bodyColor}};--otc-local-accent:{{accentColor}};">
  <div class="otc-inner">
    <header class="otc-header">
      <h2 class="otc-title">{{title|br}}</h2>
      <p class="otc-subtitle">{{subtitle|br}}</p>
    </header>
    <p class="otc-lead">{{lead|br}}</p>
    <div class="otc-body">{{body|br}}</div>
  </div>
</article>
