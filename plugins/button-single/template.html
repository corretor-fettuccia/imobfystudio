<div class="ibs-wrap" data-align="{{alignment}}" data-width="{{widthMode}}" style="--ibs-padding-y:{{paddingY}}px">
  <a class="ibs-button" data-design-role="cta" data-size="{{size}}" data-icon-position="{{iconPosition}}" href="{{href|href}}" aria-label="{{ariaLabel}}"{{#if openNewTab}} target="_blank" rel="noopener noreferrer"{{/if}}>
    {{#if icon}}<span class="ibs-button__icon" aria-hidden="true">{{icon|icon}}</span>{{/if}}
    <span class="ibs-button__label">{{label}}</span>
  </a>
</div>
