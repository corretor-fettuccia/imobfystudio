<div
  class="iwfp-widget"
  data-phone="{{phone}}"
  data-message="{{message}}"
  data-url-encoding="{{urlEncoding}}"
  data-position="{{position}}"
  data-offset-x="{{offsetX}}"
  data-offset-y="{{offsetY}}"
  data-button-size="{{buttonSize}}"
  data-show-label="{{showLabel}}"
  data-pulse="{{pulse}}"
  data-show-hover-bubble="{{showHoverBubble}}"
  data-hover-image="{{hoverImage}}"
  data-open-new-tab="{{openNewTab}}"
  style="--iwfp-bg:{{backgroundColor}};--iwfp-icon:{{iconColor}};--iwfp-text:{{textColor}};"
>
  <span class="iwfp-bubble" role="status">{{hoverText}}</span>
  <a class="iwfp-button" href="#" aria-label="{{ariaLabel}}">
    <span class="iwfp-icon-slot" aria-hidden="true">
      <svg class="iwfp-icon" viewBox="0 0 32 32" focusable="false">
        <path d="M16.04 3.2A12.7 12.7 0 0 0 5.1 22.35L3.2 29.3l7.12-1.87A12.7 12.7 0 1 0 16.04 3.2Zm0 22.98c-1.82 0-3.6-.49-5.14-1.4l-.37-.22-4.22 1.11 1.13-4.12-.24-.38a10.29 10.29 0 1 1 8.84 5.01Zm5.64-7.7c-.31-.16-1.83-.9-2.11-1.01-.29-.1-.5-.16-.7.16-.21.31-.81 1.01-1 1.22-.18.2-.36.23-.67.08-.31-.16-1.31-.48-2.5-1.54a9.4 9.4 0 0 1-1.73-2.15c-.18-.31-.02-.48.14-.63.14-.14.31-.36.47-.54.15-.18.2-.31.31-.52.1-.21.05-.39-.03-.55-.08-.15-.7-1.7-.97-2.33-.25-.61-.51-.53-.7-.54h-.6c-.21 0-.55.08-.84.39-.29.31-1.1 1.08-1.1 2.63s1.13 3.05 1.29 3.26c.15.21 2.22 3.39 5.38 4.75.75.32 1.34.52 1.8.66.76.24 1.44.21 1.99.13.61-.09 1.83-.75 2.09-1.47.26-.73.26-1.36.18-1.48-.08-.13-.29-.21-.6-.36Z"/>
      </svg>
      {{#if hoverImage}}<img class="iwfp-hover-image" src="{{hoverImage}}" alt="" loading="eager" decoding="async">{{/if}}
    </span>
    <span class="iwfp-label">{{buttonLabel}}</span>
  </a>
</div>
