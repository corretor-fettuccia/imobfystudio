<div class="location-section">
  <div class="site-container location-layout">
    <div class="location-map">
      <div class="map-grid"></div>
      <span class="map-pin">⌖</span>
      <a href="{{mapLink}}" target="_blank" rel="noopener">Abrir no mapa ↗</a>
    </div>
    <div>
      <p class="eyebrow">{{eyebrow}}</p>
      <h2>{{title}}</h2>
      <p class="address">{{address}}</p>
      <ul class="location-places">{{places|pairs}}</ul>
    </div>
  </div>
</div>
