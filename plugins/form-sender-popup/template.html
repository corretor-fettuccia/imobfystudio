<div class="fsp-anchor" data-fsp-mount data-financial-enabled="{{financialEnabled}}" data-financial-title="{{financialTitle}}" data-financial-copy="{{financialCopy}}" data-financial-questions="{{financialQuestions}}" data-product="{{product}}" data-endpoint="{{endpoint}}" data-button-text="{{buttonText}}" data-success-message="{{successMessage}}" data-trigger-type="{{triggerType}}" data-trigger-seconds="{{triggerSeconds}}" data-scroll-percent="{{scrollPercent}}" data-recall-minutes="{{recallMinutes}}" data-recall-enabled="{{recallEnabled}}" data-recall-interval="{{recallInterval}}" data-recall-unit="{{recallUnit}}" data-show-message="{{showMessage}}" data-message-placeholder="{{messagePlaceholder}}" data-require-email="{{requireEmail}}" data-lead-days="{{leadDays}}" data-horizon-days="{{horizonDays}}" data-visible-days="{{visibleDays}}" data-blocked-dates="{{blockedDates}}" data-time-zone="{{timeZone}}" data-turns="{{turns}}" data-allow-sunday="{{allowSunday}}" data-allow-monday="{{allowMonday}}" data-allow-tuesday="{{allowTuesday}}" data-allow-wednesday="{{allowWednesday}}" data-allow-thursday="{{allowThursday}}" data-allow-friday="{{allowFriday}}" data-allow-saturday="{{allowSaturday}}" data-sunday-turns="{{sundayTurns}}" data-monday-turns="{{mondayTurns}}" data-tuesday-turns="{{tuesdayTurns}}" data-wednesday-turns="{{wednesdayTurns}}" data-thursday-turns="{{thursdayTurns}}" data-friday-turns="{{fridayTurns}}" data-saturday-turns="{{saturdayTurns}}" data-appointment-prompt="{{appointmentPrompt}}" data-schedule-mode="{{scheduleMode}}" data-schedule-cta="{{scheduleCta}}" data-contact-cta="{{contactCta}}" data-enable-questions="{{enableQuestions}}" data-quick-title="{{quickTitle}}" data-accent-color="{{accentColor}}" data-surface-color="{{surfaceColor}}" data-text-color="{{textColor}}" data-radius="{{radius}}" data-use-global-style="{{useGlobalStyle}}" data-smart-plant-integration="{{smartPlantIntegration}}" data-enable-editor-preview="{{enableEditorPreview}}" data-layout-model="{{layoutModel}}" data-quick-q1-enabled="{{quickQ1Enabled}}" data-quick-q1-label="{{quickQ1Label}}" data-quick-q1-type="{{quickQ1Type}}" data-quick-q1-options="{{quickQ1Options}}" data-quick-q1-required="{{quickQ1Required}}" data-quick-q2-enabled="{{quickQ2Enabled}}" data-quick-q2-label="{{quickQ2Label}}" data-quick-q2-type="{{quickQ2Type}}" data-quick-q2-options="{{quickQ2Options}}" data-quick-q2-required="{{quickQ2Required}}" data-quick-q3-enabled="{{quickQ3Enabled}}" data-quick-q3-label="{{quickQ3Label}}" data-quick-q3-type="{{quickQ3Type}}" data-quick-q3-options="{{quickQ3Options}}" data-quick-q3-required="{{quickQ3Required}}" data-quick-q4-enabled="{{quickQ4Enabled}}" data-quick-q4-label="{{quickQ4Label}}" data-quick-q4-type="{{quickQ4Type}}" data-quick-q4-options="{{quickQ4Options}}" data-quick-q4-required="{{quickQ4Required}}" style="--fsp-accent:{{accentColor}};--fsp-surface:{{surfaceColor}};--fsp-ink:{{textColor}};--fsp-radius:{{radius}}px" aria-hidden="true"></div>
<template data-fsp-template>
  <div class="fsp-backdrop" data-plugin="form-sender-popup" data-fsp-overlay>
    <section class="fsp-dialog" role="dialog" aria-modal="true" aria-labelledby="fsp-heading" tabindex="-1">
      <header class="fsp-heading"><div class="fsp-heading-main"><span class="fsp-kicker">ATENDIMENTO PERSONALIZADO</span><h2 id="fsp-heading">{{title}}</h2><p>{{copy}}</p></div><button class="fsp-close" type="button" data-fsp-close aria-label="Fechar formulário">×</button></header>
      <form class="fsp-form" novalidate>
        <div class="fsp-page" data-fsp-page="0"><div class="fsp-fields"><label>Seu nome<input name="nome" autocomplete="name" required maxlength="120" placeholder="Como podemos chamar você?"/></label><label>WhatsApp ou telefone<input name="telefone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="22" placeholder="(51) 99999-9999"/></label><label>E-mail<input name="email" type="email" autocomplete="email" placeholder="voce@email.com" maxlength="160"/></label><label class="fsp-wide" data-fsp-message-label>Mensagem<textarea name="msg" rows="2" placeholder="{{messagePlaceholder}}" maxlength="1500"></textarea></label></div><button class="fsp-primary imobify-design-cta" data-design-role="cta" type="button" data-fsp-next>Enviar</button><small class="fsp-footnote">Seus dados serão usados para retornar seu atendimento.</small></div>
        <div class="fsp-page" data-fsp-page="1" hidden><h3>{{appointmentPrompt}}</h3><p class="fsp-help">Você escolhe o melhor momento. A visita fica sujeita à confirmação da equipe.</p><div class="fsp-choices" role="group" aria-label="Tipo de atendimento"><button type="button" data-fsp-mode="visit">{{scheduleCta}}</button><button type="button" data-fsp-mode="contact">{{contactCta}}</button></div><div class="fsp-agenda"><p class="fsp-small-title" data-fsp-date-title>Escolha uma data</p><div class="fsp-dates" data-fsp-dates></div><div class="fsp-date-nav"><button type="button" data-fsp-prev aria-label="Datas anteriores">‹ Anterior</button><button type="button" data-fsp-next-dates>Próximas ›</button></div><p class="fsp-small-title">Melhor período</p><div class="fsp-turns" data-fsp-turns></div></div><div class="fsp-actions"><button type="button" class="fsp-primary imobify-design-cta" data-design-role="cta" data-fsp-next>Enviar</button></div></div>
        <div class="fsp-page" data-fsp-page="2" hidden><h3>{{quickTitle}}</h3><div class="fsp-questions" data-fsp-questions></div><div class="fsp-actions"><button class="fsp-primary imobify-design-cta" data-design-role="cta" type="submit" data-fsp-submit>Enviar</button></div></div>
        <div class="fsp-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>
</template>
