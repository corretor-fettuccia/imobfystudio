<div class="slp-stage" data-width="{{widthMode}}" data-v-align="{{verticalAlign}}" data-h-align="{{horizontalAlign}}" data-child-mode="{{childMode}}" data-bg-enabled="{{backgroundEnabled}}" style="--slp-columns:{{columns}};--slp-tablet-columns:{{tabletColumns}};--slp-gap:{{gap}}px;--slp-padding:{{padding}}px;--slp-min-height:{{minHeight}}px;--slp-bg:{{backgroundColor}};--slp-bg-image:url('{{backgroundImage}}');--slp-overlay:{{overlayOpacity}}%;">
  <div class="slp-overlay" aria-hidden="true"></div>
  <div class="slp-inner">
    <header class="slp-heading">{{#if title}}<h2>{{title}}</h2>{{/if}}{{#if subtitle}}<p>{{subtitle|br}}</p>{{/if}}</header>
    <div class="slp-grid"><!--IMOBIFY_LAYOUT_CHILDREN--></div>
  </div>
</div>
