<div class="opp-wrap" data-dark="{{darkMode}}" data-countdown-end="{{countdownEnd}}"><div class="opp-card"><div class="opp-copy"><p class="opp-eyebrow">{{eyebrow}}</p><div class="opp-title-row"><h2>{{title}}</h2>{{#if badge}}<span class="opp-badge">{{badge}}</span>{{/if}}</div><p class="opp-condition">{{condition|br}}</p></div><div class="opp-price"><span class="opp-old">{{oldPrice}}</span><strong>{{newPrice}}</strong><span class="opp-economy">{{economy}}</span></div><a class="opp-cta" href="{{ctaLink}}">{{ctaText}}</a>{{#if countdownEnabled}}<div class="opp-countdown" aria-live="polite"><span>{{countdownLabel}}</span><strong data-countdown-value>--d --h --m --s</strong></div>{{/if}}</div></div>
