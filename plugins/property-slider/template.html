<div class="property-slider" data-autoplay="{{autoplay}}" data-interval="{{interval}}" data-fill-horizontal="{{fillHorizontal}}" data-control-shape="{{controlShape}}" data-control-position="{{controlPosition}}" data-content-align="{{contentAlign}}" data-content-position="{{contentPosition}}" data-image-fit="{{imageFit}}" data-transition="{{transition}}" data-pause-hover="{{pauseOnHover}}" data-loop="{{loop}}" data-swipe="{{swipe}}" data-slides="{{slides}}" data-image-1="{{image1}}" data-eyebrow-1="{{eyebrow1}}" data-title-1="{{title1}}" data-copy-1="{{copy1}}" data-cta-1="{{cta1}}" data-link-1="{{link1}}" data-image-2="{{image2}}" data-eyebrow-2="{{eyebrow2}}" data-title-2="{{title2}}" data-copy-2="{{copy2}}" data-cta-2="{{cta2}}" data-link-2="{{link2}}" data-image-3="{{image3}}" data-eyebrow-3="{{eyebrow3}}" data-title-3="{{title3}}" data-copy-3="{{copy3}}" data-cta-3="{{cta3}}" data-link-3="{{link3}}" tabindex="0" aria-roledescription="carrossel" style="--slider-height:{{height}}px;--slider-height-mobile:{{mobileHeight}}px;--slider-overlay:{{overlay}}%;--slider-content-width:{{contentWidth}}px;--slider-eyebrow-size:{{eyebrowSize}}px;--slider-title-size:{{titleSize}}px;--slider-text-size:{{textSize}}px;--slider-eyebrow-size-mobile:{{mobileEyebrowSize}}px;--slider-title-size-mobile:{{mobileTitleSize}}px;--slider-text-size-mobile:{{mobileTextSize}}px;--slider-image-fit:{{imageFit}};--slider-image-x:{{imagePositionX}}%;--slider-image-y:{{imagePositionY}}%;--slider-image-zoom:{{imageZoom}};--slider-transition-duration:{{transitionDuration}}ms;--slider-arrow-size:{{arrowSize}}px;--slider-arrow-icon-size:{{arrowIconSize}}px;{{#if textPadding}}--slider-text-padding:{{textPadding}}px;{{/if}}{{#if mobileTextPadding}}--slider-text-padding-mobile:{{mobileTextPadding}}px;{{/if}}">
  <div class="property-slider-track" aria-live="polite"></div>
  {{#if showArrows}}<button class="property-slider-arrow is-prev" type="button" data-slider-prev aria-label="Slide anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg></button><button class="property-slider-arrow is-next" type="button" data-slider-next aria-label="Próximo slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>{{/if}}
  {{#if showDots}}<div class="property-slider-dots" role="tablist" aria-label="Selecionar slide"></div>{{/if}}
  <div class="property-slider-progress"><span></span></div>
</div>
