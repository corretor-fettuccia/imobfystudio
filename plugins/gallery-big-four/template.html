<div class="pp-big-four-heading site-container" style="--pp-eyebrow-size:{{eyebrowSize}}px;--pp-section-title-size:{{sectionTitleSize}}px;--pp-panel-title-size:{{panelTitleSize}}px;--pp-vertical-text-size:{{verticalTextSize}}px;--pp-mobile-text-scale:{{mobileTextScale}}">
  <p class="eyebrow">{{eyebrow}}</p>
  <h2>{{title}}</h2>
</div>
<div class="pp-big-four" style="--pp-gallery-height:{{height}}px;--pp-eyebrow-size:{{eyebrowSize}}px;--pp-section-title-size:{{sectionTitleSize}}px;--pp-panel-title-size:{{panelTitleSize}}px;--pp-vertical-text-size:{{verticalTextSize}}px;--pp-mobile-text-scale:{{mobileTextScale}}">
  <div class="pp-big-four-track">
    <article class="pp-big-four-item" tabindex="0"><img src="{{image1}}" alt="{{title1}}" loading="lazy"><span class="pp-big-four-overlay"></span><strong>{{title1}}</strong><em>{{vertical1}}</em></article>
    <article class="pp-big-four-item" tabindex="0"><img src="{{image2}}" alt="{{title2}}" loading="lazy"><span class="pp-big-four-overlay"></span><strong>{{title2}}</strong><em>{{vertical2}}</em></article>
    <article class="pp-big-four-item" tabindex="0"><img src="{{image3}}" alt="{{title3}}" loading="lazy"><span class="pp-big-four-overlay"></span><strong>{{title3}}</strong><em>{{vertical3}}</em></article>
    <article class="pp-big-four-item" tabindex="0"><img src="{{image4}}" alt="{{title4}}" loading="lazy"><span class="pp-big-four-overlay"></span><strong>{{title4}}</strong><em>{{vertical4}}</em></article>
    <article class="pp-big-four-item" tabindex="0"><img src="{{image5}}" alt="{{title5}}" loading="lazy"><span class="pp-big-four-overlay"></span><strong>{{title5}}</strong><em>{{vertical5}}</em></article>
  </div>
</div>
