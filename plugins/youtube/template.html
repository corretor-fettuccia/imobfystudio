<div class="ytp-root"
  data-video-id="{{videoId}}"
  data-autoplay="{{autoplay}}"
  data-controls="{{controls}}"
  data-muted="{{muted}}"
  data-loop="{{loop}}"
  data-start="{{startSeconds}}"
  data-end="{{endSeconds}}"
  data-fullscreen="{{fullscreen}}"
  data-keyboard-controls="{{keyboardControls}}"
  data-plays-inline="{{playsInline}}"
  data-captions="{{captions}}"
  data-captions-language="{{captionsLanguage}}"
  data-interface-language="{{interfaceLanguage}}"
  data-related-videos="{{relatedVideos}}"
  data-privacy-enhanced="{{privacyEnhanced}}"
  data-lazy-load="{{lazyLoad}}"
  data-alignment="{{alignment}}"
  data-shadow="{{shadowStyle}}"
  data-player-state="loading"
  style="--ytp-ratio:{{aspectRatio}};--ytp-max:{{maxWidth}}px;--ytp-py:{{paddingY}}px;--ytp-radius:{{borderRadius}}px;--ytp-bg:{{backgroundColor}};">
  <div class="ytp-container">
    <div class="ytp-frame-shell">
      <iframe class="ytp-frame" title="{{playerTitle}}" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="ytp-placeholder" role="status">
        <strong>ID de vídeo inválido</strong>
        <span>Informe um ID do YouTube com 11 caracteres ou cole a URL do vídeo.</span>
      </div>
    </div>
  </div>
</div>
