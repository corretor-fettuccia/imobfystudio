<div class="tour360-pro" data-alignment="{{alignment}}" data-shadow="{{shadowStyle}}" style="--tour360-height:{{heightDesktop}}px;--tour360-mobile-height:{{heightMobile}}px;--tour360-max:{{maxWidth}}px;--tour360-py:{{paddingY}}px;--tour360-radius:{{radius}}px;--tour360-bg:{{backgroundColor}};">
  <textarea class="tour360-pro__config" hidden>{{tourConfig}}</textarea>
  <div class="tour360-pro__container">
    <div class="tour360-pro__frame-shell">
      <div class="tour360-pro__stage">
        <div class="tour360-pro__viewer" aria-label="Tour virtual 360 graus"></div>
        <button class="tour360-pro__spots-toggle tour360-pro__overlay" type="button" aria-expanded="false" aria-label="Abrir pontos" title="Pontos"><span class="tour360-pro__hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button>
        <aside class="tour360-pro__spots-panel" aria-label="Pontos de navegação"><div class="tour360-pro__spots-head"><strong>Pontos</strong><small></small></div><div class="tour360-pro__spots-list"></div></aside>
        <a class="tour360-pro__branding tour360-pro__overlay" hidden rel="noopener noreferrer"><img alt=""><span></span></a>
        <div class="tour360-pro__info" role="status"></div>
        <div class="tour360-pro__empty" hidden><strong>Tour 360 ainda não configurado</strong><span>No modo edição, abra o Tour 360 Studio para adicionar as cenas.</span></div>
      </div>
    </div>
  </div>
</div>
