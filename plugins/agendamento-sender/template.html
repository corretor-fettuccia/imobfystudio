<section class="ags-section" data-financial-enabled="{{financialEnabled}}" data-financial-title="{{financialTitle}}" data-financial-copy="{{financialCopy}}" data-financial-questions="{{financialQuestions}}" data-fixed-background="{{fixedBackground}}" data-background-image="{{backgroundImage}}" data-ags-panel-enabled="{{showConversionPanel}}" data-ags-theme="{{themeMode}}" data-ags-preset="{{visualPreset}}" data-ags-project-profile="{{__projectProfile}}" data-ags-conversion-layout="{{conversionLayout}}" data-ags-pulse="{{pulseIntensity}}" style="--ags-custom-accent:{{accentColor}};--ags-custom-selected-text:{{selectedTextColor}};--ags-custom-tile:{{tileColor}};--ags-custom-background:{{pageColor}};--ags-custom-title:{{titleColor}};--ags-custom-muted:{{mutedColor}};--ags-custom-border:{{borderColor}};--ags-custom-radius:{{cardRadius}}px">
  <div class="ags-container" data-ags-mount
    data-product="{{product}}" data-endpoint="{{endpoint}}"
    data-lead-days="{{leadDays}}" data-horizon-days="{{horizonDays}}" data-visible-days="{{visibleDays}}"
    data-allow-sunday="{{allowSunday}}" data-allow-monday="{{allowMonday}}" data-allow-tuesday="{{allowTuesday}}" data-allow-wednesday="{{allowWednesday}}" data-allow-thursday="{{allowThursday}}" data-allow-friday="{{allowFriday}}" data-allow-saturday="{{allowSaturday}}"
    data-blocked-dates="{{blockedDates}}" data-turns="{{turns}}" data-default-turn="{{defaultTurn}}"
    data-time-zone="{{timeZone}}" data-sunday-turns="{{sundayTurns}}" data-monday-turns="{{mondayTurns}}" data-tuesday-turns="{{tuesdayTurns}}" data-wednesday-turns="{{wednesdayTurns}}" data-thursday-turns="{{thursdayTurns}}" data-friday-turns="{{fridayTurns}}" data-saturday-turns="{{saturdayTurns}}"
    data-button-text="{{buttonText}}" data-success-message="{{successMessage}}"
    data-show-email="{{showEmail}}" data-require-email="{{requireEmail}}" data-show-conversion-panel="{{showConversionPanel}}">
    <div class="ags-primary">
    <header class="ags-heading">
      <h2 class="ags-title"><svg class="ags-calendar-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span>{{title}}</span></h2>
      <p class="ags-copy">{{copy}}</p>
    </header>
    <div class="ags-days-control" aria-label="Escolha uma data para visitar">
      <button type="button" class="ags-arrow ags-prev" aria-label="Ver datas anteriores" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="ags-day-list" role="group" aria-label="Datas para solicitar uma visita"></div>
      <button type="button" class="ags-arrow ags-next" aria-label="Ver próximas datas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <form class="ags-form" novalidate>
      <input class="ags-input" name="nome" type="text" placeholder="Nome" aria-label="Nome completo" autocomplete="name" required maxlength="120"/>
      <input class="ags-input ags-email" name="email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="email" required maxlength="160"/>
      <input class="ags-input" name="telefone" type="tel" placeholder="Telefone" aria-label="Telefone" autocomplete="tel" inputmode="tel" required maxlength="22"/>
      <div class="ags-turn-wrapper"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><select class="ags-turn" name="turnoPreferido" aria-label="Turno preferido" required></select><svg class="ags-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg></div>
      <button type="submit" class="ags-submit" title="{{buttonText}}" aria-label="{{buttonText}}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="m22 2-7.1 20-3.9-8.9L2 9.2z"/><path d="M22 2 11 13"/></svg><span class="ags-submit-label">{{buttonText}}</span></button>
    </form>
    <div class="ags-time-zone" aria-label="Fuso horário da agenda"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span class="ags-time-zone-label"></span></div>
    <div class="ags-status" role="status" aria-live="polite"></div>
    <p class="ags-selected-plant" data-ags-selected-plant hidden></p>
    </div>
    <aside class="ags-conversion-panel" aria-label="Convite para agendar visita" data-ags-conversion>
      <span class="ags-conversion-glow" aria-hidden="true"></span>
      <span class="ags-conversion-eyebrow">{{conversionEyebrow}}</span>
      <div class="ags-illustration" aria-hidden="true">
        <span class="ags-orbit ags-orbit-first"></span><span class="ags-orbit ags-orbit-second"></span>
        <svg class="ags-illustration-calendar" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="24" y="31" width="80" height="72" rx="14" stroke-width="4"/><path d="M24 52h80M44 21v20M84 21v20" stroke-width="5"/>
          <path d="M45 73l13 13 26-29" stroke-width="7"/>
        </svg>
        <span class="ags-illustration-spark ags-illustration-spark-a"></span><span class="ags-illustration-spark ags-illustration-spark-b"></span>
      </div>
      <h3 class="ags-conversion-headline">{{conversionHeadline}}</h3>
      <p class="ags-conversion-description">{{conversionDescription}}</p>
      <button class="ags-conversion-cta" type="button" data-ags-send><span>{{conversionAction}}</span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <p class="ags-conversion-trust"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>{{conversionBadge}}</p>
    </aside>
  </div>
</section>
