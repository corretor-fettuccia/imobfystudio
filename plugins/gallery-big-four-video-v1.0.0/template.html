<div class="pp-big-four-heading site-container">
  <p class="eyebrow">{{eyebrow}}</p>
  <h2>{{title}}</h2>
</div>
<div class="pp-big-four" style="--pp-gallery-height:{{height}}px">
  <div class="pp-big-four-track">
    <article class="pp-big-four-item" tabindex="0">
      <div class="pp-big-four-media" data-media-type="{{mediaType1}}" data-video-behavior="{{videoBehavior1}}" style="--pp-video-fit:{{videoFit1}};--pp-video-position:{{videoPosition1}}">
        <img src="{{image1}}" alt="{{title1}}" loading="lazy">
        <video data-src="{{video1}}" poster="{{image1}}" muted playsinline preload="metadata" aria-label="{{title1}}"></video>
      </div>
      <span class="pp-big-four-overlay"></span><strong>{{title1}}</strong><em>{{vertical1}}</em>
    </article>
    <article class="pp-big-four-item" tabindex="0">
      <div class="pp-big-four-media" data-media-type="{{mediaType2}}" data-video-behavior="{{videoBehavior2}}" style="--pp-video-fit:{{videoFit2}};--pp-video-position:{{videoPosition2}}">

</div>
