<div class="fsp-wrap" data-phone="{{whatsapp}}"><header class="fsp-head"><p class="fsp-eyebrow">{{eyebrow}}</p><h2>{{title}}</h2><p>{{description|br}}</p></header><div class="fsp-grid"><form class="fsp-form" onsubmit="return false"><label>Valor do imóvel <input data-fsp="value" type="number" min="0" step="1000" value="{{propertyValue}}"></label><label>Entrada <input data-fsp="entry" type="number" min="0" step="1000" value="{{downPayment}}"></label><label>Taxa anual estimada (%) <input data-fsp="rate" type="number" min="0" max="30" step="0.1" value="{{annualRate}}"></label><label>Prazo (anos) <input data-fsp="years" type="number" min="1" max="35" step="1" value="{{years}}"></label><label>Renda mensal <input data-fsp="income" type="number" min="0" step="500" value="{{monthlyIncome}}"></label></form><div class="fsp-result"><small>FINANCIAMENTO ESTIMADO</small><strong data-fsp-financed>R$ 0</strong><span>Parcela matemática aproximada</span><strong class="fsp-payment" data-fsp-payment>R$ 0/mês</strong><div class="fsp-metrics"><p><span>Comprometimento da renda</span><b data-fsp-ratio>—</b></p><p><span>Total nominal das parcelas</span><b data-fsp-total>—</b></p></div><a data-fsp-cta href="#">{{ctaText}}</a></div></div><p class="fsp-disclaimer">{{disclaimer|br}}</p></div>
