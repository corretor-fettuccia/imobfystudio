<div class="ims360" data-mode="hero" style="--ims360-height:{{heightDesktop}}px;--ims360-height-mobile:{{heightMobile}}px;--ims360-overlay:{{overlayOpacity}}%;--ims360-accent:{{accentColor}};--ims360-text:{{textColor}};" data-full-sphere="{{fullSphere}}" data-normalize-sphere="{{normalizeSphere}}" data-hero-hfov="{{heroHfov}}" data-hero-hide-delay="{{heroHideDelay}}" data-idle="{{idleSeconds}}" data-sway-yaw="{{swayYaw}}" data-sway-pitch="{{swayPitch}}" data-sway-cycle="{{swayCycleSeconds}}" data-scroll="{{scrollNavigation}}" data-progress="{{showProgress}}" data-scenes-menu="{{showSceneMenu}}" data-navigation-panel="{{showNavigationPanel}}" data-motion-enabled="{{motionEnabled}}" data-motion-activation="{{motionActivation}}" data-motion-sensitivity="{{motionSensitivity}}" data-motion-smoothing="{{motionSmoothing}}" data-motion-recenter="{{motionRecenter}}" data-motion-touch="{{motionTouchFallback}}">
  <textarea class="ims360-config" hidden>{{tourConfig}}</textarea>
  <div class="ims360-frame"><div class="ims360-viewer" aria-label="Panorama interativo de 360 graus"></div><img class="ims360-poster" alt="" aria-hidden="true" loading="eager" decoding="async">
    <div class="ims360-vignette" aria-hidden="true"></div>
    <div class="ims360-topline"><span class="ims360-brand">TOUR 360°</span><span class="ims360-scene-name" aria-live="polite"></span></div>
    <div class="ims360-copy"><p class="ims360-eyebrow">{{eyebrow}}</p><h2 class="ims360-headline">{{headline}}</h2><p class="ims360-subheadline">{{subheadline}}</p>{{#if ctaLabel}}<a class="ims360-cta" href="{{ctaUrl}}" data-hero-cta>{{ctaLabel}} <span aria-hidden="true">↗</span></a>{{/if}}</div>
    <nav class="ims360-navigation" aria-label="Navegação de experiência"><button class="ims360-prev" type="button" aria-label="Anterior">←</button><span class="ims360-counter" aria-live="polite"></span><button class="ims360-next" type="button" aria-label="Próximo">→</button></nav>
    <button class="ims360-scene-toggle" type="button" aria-controls="ims360-scene-list" aria-expanded="false">Ambientes <span aria-hidden="true">⌄</span></button><nav class="ims360-scene-list" hidden aria-label="Selecionar ambiente"></nav>
    <div class="ims360-motion" hidden aria-label="Navegação imersiva">
      <button type="button" class="ims360-motion-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 8C2.5 10 2.5 14 4 16M20 8c1.5 2 1.5 6 0 8M10 18h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Explorar em 360°</span></button>
    </div>
    <div class="ims360-tip">Arraste para olhar ao redor <span aria-hidden="true">·</span> Toque nos pontos</div>
    <div class="ims360-empty" hidden><strong>Tour 360 ainda não configurado</strong><span>Abra o Studio deste plugin e adicione uma cena panorâmica e hotspots.</span></div>
    <div class="ims360-error" hidden role="status"></div>
  </div>
</div>
