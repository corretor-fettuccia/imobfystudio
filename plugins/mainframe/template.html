<div class="mf-root" data-mf-mode="{{mode}}" data-mf-url="{{url}}" data-mf-html="{{htmlContent}}" data-mf-lazy="{{lazyLoad}}" data-mf-fullscreen="{{allowFullscreen}}" data-mf-autoplay="{{allowAutoplay}}" data-mf-clipboard="{{allowClipboard}}" data-mf-html-scripts="{{htmlScripts}}" data-mf-fullwidth="{{fullWidth}}" data-mf-align="{{alignment}}" data-mf-shadow="{{shadow}}" style="--mf-desktop:{{heightDesktop}}px;--mf-mobile:{{heightMobile}}px;--mf-max:{{maxWidth}}px;--mf-padding:{{paddingY}}px;--mf-radius:{{radius}}px;--mf-bg:{{background}};">
  <div class="mf-container"><div class="mf-surface">
    <iframe class="mf-frame" title="{{title}}" referrerpolicy="origin"></iframe>
    <div class="mf-notice" role="status" hidden></div>
    {{#if url}}<noscript><a class="mf-noscript" href="{{url}}" target="_blank" rel="noopener">Abrir {{title}}</a></noscript>{{/if}}
  </div></div>
</div>
